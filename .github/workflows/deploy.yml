name: Deploy norosi Bot to Remote Server (kami-aio)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to kami-aio (n.kami.live:29023) via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate GitHub Secrets
        env:
          SSH_KEY_SECRET: ${{ secrets.GCP_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY_SECRET" ]; then
            echo "❌ [오류] SSH 개인키 시크릿(GCP_SSH_KEY 또는 SSH_PRIVATE_KEY)이 설정되지 않았습니다."
            echo "👉 GitHub Settings > Secrets and variables > Actions > Repository secrets에 SSH 개인키를 등록해주세요."
            exit 1
          fi
          echo "✅ SSH 배포용 개인키 시크릿 확인 완료! (대상 서버: kami@n.kami.live:29023)"

      - name: Setup SSH Key & Deploy to kami-aio
        env:
          GCP_HOST: ${{ secrets.SSH_HOST || secrets.GCP_HOST || 'n.kami.live' }}
          GCP_PORT: ${{ secrets.SSH_PORT || secrets.GCP_PORT || '29023' }}
          GCP_USER: ${{ secrets.SSH_USER || secrets.GCP_USER || 'kami' }}
          GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          DISCORD_TOKEN_SECRET: ${{ secrets.DISCORD_TOKEN }}
          SSH_KNOWN_HOSTS_SECRET: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          trap 'rm -f ~/.ssh/gcp_deploy_key' EXIT

          # 비밀키 자동 정규화 및 저장 (PEM/OpenSSH 텍스트, Base64, CRLF, 하이픈 누락 자동 보정)
          python3 - << 'EOF'
          import os, re, base64, pathlib, sys

          raw = os.environ.get("GCP_SSH_KEY", "").strip()

          if raw.startswith(("ssh-rsa", "ssh-ed25519", "ecdsa-sha2")):
              sys.exit("❌ [오류] GCP_SSH_KEY에 개인키(Private Key)가 아닌 공개키(.pub)가 입력되어 있습니다.")

          if "BEGIN" not in raw:
              try:
                  raw = base64.b64decode(re.sub(r"\s+", "", raw)).decode("utf-8", errors="ignore").strip()
              except Exception:
                  sys.exit("❌ [오류] GCP_SSH_KEY가 올바른 PEM 형식도 아니고 유효한 Base64 문자열도 아닙니다.")

          raw = raw.replace("\r\n", "\n").replace("\r", "\n")
          m = re.search(r"(-+BEGIN [^-]+-+)(.*?)(-+END [^-]+-+)", raw, re.DOTALL)
          if not m:
              sys.exit("❌ [오류] SSH 개인키의 BEGIN/END 헤더 또는 푸터를 찾을 수 없습니다. 키 전체가 복사되었는지 확인해주세요.")

          header = "-----" + m.group(1).strip().strip("-") + "-----"
          footer = "-----" + m.group(3).strip().strip("-") + "-----"
          body_lines = [line.strip() for line in m.group(2).split() if line.strip()]
          clean_key = header + "\n" + "\n".join(body_lines) + "\n" + footer + "\n"

          key_path = pathlib.Path.home() / ".ssh" / "gcp_deploy_key"
          key_path.write_text(clean_key, encoding="utf-8")
          key_path.chmod(0o600)
          EOF

          # SSH 개인키 유효성 사전 검증
          if ! ssh-keygen -y -f ~/.ssh/gcp_deploy_key > /dev/null 2>&1; then
            echo "❌ [오류] SSH 키 형식이 손상되었거나 암호(Passphrase)가 걸려 있습니다. 암호 없는 개인키 전문을 GCP_SSH_KEY에 다시 등록해주세요."
            exit 1
          fi
          echo "✅ SSH 개인키 포맷 검증 완료!"

          # ~/.ssh/config 에 kami-aio 프로필 등록 (Host kami-aio / HostName n.kami.live / Port 29023 / User kami)
          cat << 'SSH_CFG' > ~/.ssh/config
          Host kami-aio
              HostName n.kami.live
              Port 29023
              User kami
              IdentityFile ~/.ssh/gcp_deploy_key
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          SSH_CFG
          chmod 600 ~/.ssh/config

          # 현재 개인키에서 추출한 정확한 공개키(Public Key) 준비 (권한 거부 시 안내용)
          DERIVED_PUBKEY="$(ssh-keygen -y -f ~/.ssh/gcp_deploy_key) kami@kami-aio"

          # 원격 SSH 서버 연결 탐색 (kami-aio [kami@n.kami.live:29023] 최우선 시도 후 시크릿 설정값 폴백)
          set +e
          ACTIVE_HOST="n.kami.live"
          ACTIVE_PORT="29023"
          ACTIVE_USER="kami"
          CONNECTED=0

          # 후보 엔드포인트 목록: "유저|호스트|포트"
          CANDIDATES=(
            "kami|n.kami.live|29023"
          )
          if [ -n "${GCP_HOST}" ] && [ "${GCP_HOST}" != "kami-aio" ]; then
            CLEAN_HOST="${GCP_HOST%:*}"
            EXTRACTED_PORT="${GCP_HOST##*:}"
            if [ "$CLEAN_HOST" != "$EXTRACTED_PORT" ] && [[ "$EXTRACTED_PORT" =~ ^[0-9]+$ ]]; then
              CANDIDATE_PORT="$EXTRACTED_PORT"
            else
              CANDIDATE_PORT="${GCP_PORT:-29023}"
            fi
            CANDIDATES+=("${GCP_USER:-kami}|${CLEAN_HOST}|${CANDIDATE_PORT}")
            if [ "${GCP_USER}" != "kami" ]; then
              CANDIDATES+=("kami|${CLEAN_HOST}|29023")
            fi
          fi

          # 선택적 SSH 호스트 키 고정 (GitHub Secrets에 SSH_KNOWN_HOSTS가 등록된 경우 StrictHostKeyChecking=yes)
          SSH_HOST_CHECK="accept-new"
          if [ -n "${SSH_KNOWN_HOSTS_SECRET}" ]; then
            printf "%s\n" "${SSH_KNOWN_HOSTS_SECRET}" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            SSH_HOST_CHECK="yes"
            echo "🔒 SSH_KNOWN_HOSTS 적용됨 (StrictHostKeyChecking=yes)"
          fi

          for ENTRY in "${CANDIDATES[@]}"; do
            IFS='|' read -r C_USER C_HOST C_PORT <<< "$ENTRY"
            echo "🔍 SSH 연결 테스트: ${C_USER}@${C_HOST} (Port ${C_PORT}) ..."
            if ssh -p "${C_PORT}" -o "StrictHostKeyChecking=${SSH_HOST_CHECK}" -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/gcp_deploy_key "${C_USER}@${C_HOST}" "true" 2>/dev/null; then
              ACTIVE_USER="${C_USER}"
              ACTIVE_HOST="${C_HOST}"
              ACTIVE_PORT="${C_PORT}"
              CONNECTED=1
              echo "✅ SSH 연결 확인 성공: ${ACTIVE_USER}@${ACTIVE_HOST}:${ACTIVE_PORT}"
              break
            fi
          done

          # GitHub Secrets에 DISCORD_TOKEN이 등록된 경우 서버의 .env에 자동 동기화용 base64 페이로드
          # (명령행 인자 argv 대신 stdin 첫 줄로 전달하여 원격 ps/proc 노출 차단)
          TOKEN_B64=""
          if [ -n "${DISCORD_TOKEN_SECRET}" ]; then
            TOKEN_B64=$(printf "%s" "${DISCORD_TOKEN_SECRET}" | base64 -w 0 2>/dev/null || printf "%s" "${DISCORD_TOKEN_SECRET}" | base64)
          fi

          {
            printf "%s\n" "${TOKEN_B64}"
            cat << 'REMOTE_SCRIPT'
          set -e
          read -r TOKEN_B64
          ACTIVE_USER="$1"

          echo "=========================================="
          echo "🚀 [1/4] norosi 디렉토리 이동 및 최신 코드 반영..."
          echo "=========================================="
          TARGET_DIR="/home/kami/Desktop/norosi"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="$HOME/Desktop/norosi"
          fi
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="$HOME/norosi"
          fi
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="/home/kami/norosi"
          fi
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="/home/${ACTIVE_USER}/norosi"
          fi
          cd "$TARGET_DIR"
          echo "📂 배포 대상 경로: $TARGET_DIR"

          git fetch origin
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "master")
          git reset --hard "origin/$CURRENT_BRANCH" 2>/dev/null || git reset --hard origin/master 2>/dev/null || git reset --hard origin/main

          # GitHub Secrets의 DISCORD_TOKEN이 전달된 경우 .env 자동 동기화
          if [ -n "$TOKEN_B64" ]; then
            RESOLVED_TOKEN=$(echo "$TOKEN_B64" | base64 -d)
            if [ -n "$RESOLVED_TOKEN" ]; then
              umask 077
              if [ ! -f .env ]; then
                printf "DISCORD_TOKEN=%s\n" "$RESOLVED_TOKEN" > .env
                chmod 600 .env
                echo "🔒 [보안] GitHub Secrets의 DISCORD_TOKEN으로 .env 파일 생성 완료!"
              elif ! grep -q "DISCORD_TOKEN=" .env || grep -q "^DISCORD_TOKEN=$" .env; then
                printf "\nDISCORD_TOKEN=%s\n" "$RESOLVED_TOKEN" >> .env
                chmod 600 .env
                echo "🔒 [보안] .env 파일에 DISCORD_TOKEN 자동 주입 완료!"
              fi
            fi
          fi

          echo "=========================================="
          echo "📦 [2/4] Python 가상환경 의존성 확인..."
          echo "=========================================="
          if [ -d .venv ]; then
            source .venv/bin/activate
          elif [ -d venv ]; then
            source venv/bin/activate
          else
            python3 -m venv venv
            source venv/bin/activate
          fi
          pip install -r requirements.txt --quiet
          pip install -U yt-dlp --quiet || true

          echo "=========================================="
          echo "🔄 [3/4] norosi 봇 프로세스 재시작..."
          echo "=========================================="
          USE_SYSTEMD=0
          if [ -d /run/systemd/system ]; then
            if sudo -n systemctl restart norosi 2>/dev/null; then
              echo "✅ systemd 시스템 서비스(norosi) 재시작 완료!"
              USE_SYSTEMD=1
            elif systemctl --user restart norosi 2>/dev/null; then
              echo "✅ systemd 유저 서비스(norosi) 재시작 완료!"
              USE_SYSTEMD=1
            fi
          fi

          if [ "$USE_SYSTEMD" -eq 0 ]; then
            echo "ℹ️ 컨테이너/비-systemd 환경 감지됨 (PID 1 != systemd) -> 24/7 백그라운드 데몬 모드로 재기동합니다."
            # 1. 기존 감시 루프(supervisor) 및 봇 프로세스 안전 종료
            if [ -f "$TARGET_DIR/.norosi_supervisor.pid" ]; then
              kill -9 $(cat "$TARGET_DIR/.norosi_supervisor.pid") 2>/dev/null || true
              rm -f "$TARGET_DIR/.norosi_supervisor.pid"
            fi
            pkill -9 -f "[n]orosi_keepalive" 2>/dev/null || true

            if [ -f "$TARGET_DIR/.norosi.pid" ]; then
              kill $(cat "$TARGET_DIR/.norosi.pid") 2>/dev/null || true
              rm -f "$TARGET_DIR/.norosi.pid"
            fi
            pkill -f "[p]ython.*bot\.py" 2>/dev/null || true
            sleep 1
            pkill -9 -f "[p]ython.*bot\.py" 2>/dev/null || true

            # 2. 24/7 자동 재시작 백그라운드 데몬 스크립트 생성 및 실행
            python3 - "$TARGET_DIR/.norosi_keepalive.sh" << 'PY_EOF'
          import pathlib, sys
          script_path = pathlib.Path(sys.argv[1])
          script_content = """#!/usr/bin/env bash
          cd "$(dirname "$0")"
          WORK_DIR="$(pwd)"
          echo $$ > "$WORK_DIR/.norosi_supervisor.pid"
          if [ -x "$WORK_DIR/.venv/bin/python3" ]; then
            PY_BIN="$WORK_DIR/.venv/bin/python3"
          elif [ -x "$WORK_DIR/venv/bin/python3" ]; then
            PY_BIN="$WORK_DIR/venv/bin/python3"
          else
            PY_BIN="python3"
          fi
          while true; do
            "$PY_BIN" -u "$WORK_DIR/bot.py" >> "$WORK_DIR/bot.log" 2>&1 &
            BOT_PID=$!
            echo $BOT_PID > "$WORK_DIR/.norosi.pid"
            wait $BOT_PID
            EXIT_CODE=$?
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] ⚠️ bot.py 종료됨 (코드: $EXIT_CODE) - 5초 후 자동 재시작..." >> "$WORK_DIR/bot.log"
            sleep 5
          done
          """
          lines = [line[10:] if line.startswith("          ") else line for line in script_content.splitlines()]
          script_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          script_path.chmod(0o755)
          PY_EOF
            : > "$TARGET_DIR/bot.log"
            setsid nohup bash -c "exec -a norosi_keepalive '$TARGET_DIR/.norosi_keepalive.sh'" </dev/null >/dev/null 2>&1 &
            sleep 3
          fi

          echo "=========================================="
          echo "✅ [4/4] 봇 가동 상태 확인..."
          echo "=========================================="
          if [ "$USE_SYSTEMD" -eq 1 ]; then
            if sudo -n systemctl is-active --quiet norosi 2>/dev/null || systemctl --user is-active --quiet norosi 2>/dev/null; then
              echo "🎉 [배포 성공] kami-aio (n.kami.live) 서버에서 norosi 봇(systemd) 정상 가동!"
            fi
            echo "=========================================="
            echo "📋 [5/5] 최근 봇 실행 저널 로그 (최근 70줄)..."
            echo "=========================================="
            sleep 2
            sudo -n journalctl -u norosi -n 70 --no-pager 2>/dev/null || journalctl --user -u norosi -n 70 --no-pager 2>/dev/null || true
          else
            RUNNING_PID=$(pgrep -f "[p]ython.*bot\.py" | head -n 1 || true)
            if [ -n "$RUNNING_PID" ]; then
              echo "🎉 [배포 성공] kami-aio (n.kami.live) 서버에서 norosi 봇 백그라운드 정상 가동! (PID: $RUNNING_PID)"
            else
              echo "⚠️ 봇 프로세스 시작 확인 중... 아래 bot.log를 확인하세요."
            fi
            echo "=========================================="
            echo "📋 [5/5] 최근 봇 실행 로그 (bot.log 최근 70줄)..."
            echo "=========================================="
            sleep 2
            tail -n 70 "$TARGET_DIR/bot.log" 2>/dev/null || true
          fi
          REMOTE_SCRIPT
          } | ssh -p "${ACTIVE_PORT}" -o "StrictHostKeyChecking=${SSH_HOST_CHECK}" -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/gcp_deploy_key \
            "${ACTIVE_USER}@${ACTIVE_HOST}" \
            "bash -s -- '${ACTIVE_USER}'"
          SSH_EXIT_CODE=$?
          set -e

          if [ $SSH_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "================================================================================"
            echo "🚨 [원인 안내] kami-aio (kami@n.kami.live:29023) SSH 접속 또는 배포 중 오류가 발생했습니다!"
            echo ""
            echo "🛠️ [해결 방법 1 - 새 서버에 공개키 등록]"
            echo "로컬 터미널에서 ssh kami-aio (또는 ssh -p 29023 kami@n.kami.live) 접속 후 아래 명령어를 1회 실행하세요:"
            echo "--------------------------------------------------------------------------------"
            echo "mkdir -p ~/.ssh && chmod 700 ~/.ssh && echo \"$DERIVED_PUBKEY\" >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys"
            echo "--------------------------------------------------------------------------------"
            echo ""
            echo "🛠️ [해결 방법 2 - 서버에서 원클릭 키 & 권한 설정 스크립트 실행]"
            echo "서버 접속 후: cd /home/kami/Desktop/norosi && bash deploy/fix_ssh_key.sh"
            echo "================================================================================"
            exit $SSH_EXIT_CODE
          fi



